<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {}
    #Header {display: flex; justify-content: center; align-items: flex-end; margin: -8px; margin-bottom: 0px; border-bottom: 2px solid black;}
    #HeaderText {padding: .7em;}
    #MainContainer {background-color: green; height: 30vh; display: flex; margin-left: -8px; margin-right: -8px; }
    #TimekeeperBox {background-color:#2854AB ;border: 1px solid black; height: fit-content; margin: 1em; margin-top: 2em;}
    #FlipperBox { display: flex;}
    #Flipper {background-color: rgb(165, 165, 165); height: 12vh; border: 1px solid black; width: 14vw; margin-top: -1em; margin-left: .3em; margin-bottom: .3em; display: flex; justify-content: center; align-items: center;}
    #Flip2 {margin: auto; font-size: 2.75rem;}
    #Flip3 {margin: auto; font-size: 2.75rem;}
    #TimerWordsContainer {background-color: #e20707; display: flex; justify-content: center;}
    #TimerWords {font-size: .6rem; color: white; margin: .7em; display: flex;}
    #demo {color: white; font-size: 1.75rem; margin: auto; margin-left: .3em; margin-right: .3em;}
</style>
<body>
    <div id="Header">
        <div id="HeaderText">
        Visit Detail
        </div>
    </div>

    <div id="MainContainer">
        <div id="TimekeeperBox">
            
            <div id="FlipperBox">
                <div id="Flipper"></div>
                <div id="Flipper">  <p id="Flip2">X</p>  </div>
                <div id="Flipper">  <p id="Flip3">X</p>  </div>
                <p id="demo">Days</p>
            </div>

            <div id="TimerWordsContainer">
                <p id="TimerWords">
                CITIZEN | OFFICIAL TIMEKEEPER
                </p>
            </div>
        </div>
    </div>
</body>
</html>




<script>

var countDownDate = new Date("Nov 27, 2026").getTime();


var x = setInterval(function() {

  
  var now = new Date().getTime();

 
  var distance = countDownDate - now;


  var days = Math.floor(distance / (1000 * 60 * 60 * 24));
  //var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));

  const [a, b] = days.toString().split('').map(Number);

  document.getElementById("Flip2").innerHTML = a;
  document.getElementById("Flip3").innerHTML = b;


 // document.getElementById("demo").innerHTML = days + " Days";// + "d " + hours + "h ";


  if (distance < 0) {
    clearInterval(x);
    document.getElementById("demo").innerHTML = `I owe you a big hug if you see this ;)`;
  }
}, 1000);
</script>
