</head>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Sofia+Sans+Condensed:ital,wght@0,1..1000;1,1..1000&display=swap');

    #TimekeeperBox {background-color:#2854AB ; height: fit-content;}
    #FlipperBox { display: flex;}
    #Flipper {background-image: url("recources/images/FlipperText.png"); background-size: 12vh; height: 12vh; border-radius: .3em; width: 14vw; margin-top: -1em; margin-left: .3em; margin-bottom: .3em; display: flex; justify-content: center; align-items: center;}

<body>
    <div id="Header">

        <div id="TimekeeperBox">
            
            <div id="FlipperBox">
                <div id="Flipper">  <p class="FlipperContent">♡</p>  </div>
                <div id="Flipper">  <p id="Flip2" class="FlipperContent">🗘</p>  </div>
                <div id="Flipper">  <p id="Flip3" class="FlipperContent">🗘</p>  </div>
                <p id="FlipperBoxText">Days</p>
            </div>

            <div id="TimerWordsContainer">
                <p id="TimerWords">
                CITIZEN | OFFICIAL TIMEKEEPER
                </p>
            </div>
        </div>
    </div>

</html>




<script>

var countDownDate = new Date("Nov 27, 2026").getTime();


var x = setInterval(function() {

  
  var now = new Date().getTime();

 
  var distance = countDownDate - now;


  var days = Math.floor(distance / (1000 * 60 * 60 * 24));
  //var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  const [a, b] = days.toString().split('').map(Number);

  if (days<10) {
  
  document.getElementById("Flip2").innerHTML = 0;
  document.getElementById("Flip3").innerHTML = a;

  }else {


  document.getElementById("Flip2").innerHTML = a;
  document.getElementById("Flip3").innerHTML = b;
  };

 // document.getElementById("demo").innerHTML = days + " Days";// + "d " + hours + "h ";


  if (distance < 0) {
    clearInterval(x);
    document.getElementById("demo").innerHTML = `I owe you a big hug if you see this ;)`;
  }
}, 1000);
</script>
