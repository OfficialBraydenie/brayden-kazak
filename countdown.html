<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {}
    #Header {background-color: aqua; height: 10vh; border: 3px solid black; display: flex; justify-content: center; align-items: flex-end; margin: -8px; margin-bottom: 0px;}
    #HeaderText {padding-bottom: 10px;}
    #MainContainer {background-color: green; height: 40vh;}
    #TimekeeperBox {}
</style>
<body>
    <div id="Header">
        <div id="HeaderText">
        Visit Detail
        </div>
    </div>
    <div id="MainContainer">
        <div id="TimekeeperBox">
            <p id="demo"></p>
        </div>
    </div>
</body>
</html>




<script>
// Set the date we're counting down to
var countDownDate = new Date("Nov 26, 2026 14:00").getTime();

// Update the count down every 1 second
var x = setInterval(function() {

  // Get today's date and time
  var now = new Date().getTime();

  // Find the distance between now and the count down date
  var distance = countDownDate - now;

  // Time calculations for days, hours, minutes and seconds
  var days = Math.floor(distance / (1000 * 60 * 60 * 24));
  var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));

  // Display the result in the element with id="demo"
  document.getElementById("demo").innerHTML = days + "d " + hours + "h ";

  // If the count down is finished, write some text
  if (distance < 0) {
    clearInterval(x);
    document.getElementById("demo").innerHTML = `I owe you a big hug if you see this ;)`;
  }
}, 1000);
</script>
